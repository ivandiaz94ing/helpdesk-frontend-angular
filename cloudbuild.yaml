steps:
  # 1. Construir la imagen de Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/frontend-helpdesk:$COMMIT_SHA', '.']

  # 2. Subir la imagen al registro de contenedores de Google
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/frontend-helpdesk:$COMMIT_SHA']

  # 3. Desplegar la imagen en Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'frontend-helpdesk'
      - '--image'
      - 'gcr.io/$PROJECT_ID/frontend-helpdesk:$COMMIT_SHA'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '80'

images:
  - 'gcr.io/$PROJECT_ID/frontend-helpdesk:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
