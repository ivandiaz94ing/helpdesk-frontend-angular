<main class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 border-b-2 border-green-700 pb-2">
      Mesa de Ayuda - Batallón
    </h1>

    @if (tickets().length === 0) {
      <div class="p-4 bg-blue-50 text-blue-700 rounded-md">
        No hay reportes activos en este momento.
      </div>
    } @else {
      <ul class="space-y-4">
        @for (ticket of tickets(); track ticket.id) {
          <li class="bg-white p-5 rounded-lg shadow-sm border-l-4"
              [class.border-red-500]="ticket.status === 'Abierto'"
              [class.border-yellow-500]="ticket.status === 'En progreso'"
              [class.border-gray-400]="ticket.status === 'Cerrado'">

            <div class="flex justify-between items-center">
              <span class="font-medium text-gray-700">{{ ticket.issue }}</span>
              <span class="text-sm px-2 py-1 bg-gray-100 rounded-full text-gray-600">
                {{ ticket.status }}
              </span>
            </div>
          </li>
        }
      </ul>
    }
  </div>
</main>
