    <div class="max-w-3xl mx-auto pt-6 px-6">
      <button class="btn btn-ghost text-slate-500 hover:text-primary gap-2" (click)="volver()">
        <i class='bx bx-arrow-back text-xl'></i> Volver al panel
      </button>
    </div>
    
<div class="max-w-3xl mx-auto p-6 mt-8 bg-white rounded-2xl shadow-sm border border-slate-100">

  <div class="flex items-center gap-4 border-b border-slate-100 pb-6 mb-6">
    <div class="w-16 h-16 rounded-full bg-primary/10 text-primary flex items-center justify-center text-2xl font-bold">
      {{ user()?.fullname?.substring(0, 2) | uppercase }}
    </div>
    <div>
      <h2 class="text-2xl font-bold text-slate-800">{{ user()?.fullname }}</h2>
      <p class="text-slate-500">{{ user()?.email }} • <span class="uppercase font-semibold text-primary">{{ user()?.role }}</span></p>
    </div>
  </div>

  <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
    <i class='bx bx-lock-alt text-xl'></i> Cambio de Contraseña
  </h3>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="form-control w-full">
      <label class="label"><span class="label-text font-semibold text-slate-600">Contraseña Actual</span></label>
      <input type="password" [(ngModel)]="currentPassword" placeholder="••••••••" class="input input-bordered w-full" />
    </div>

    <div></div> <!-- Espacio vacío en el grid -->

    <div class="form-control w-full">
      <label class="label"><span class="label-text font-semibold text-slate-600">Nueva Contraseña</span></label>
      <input type="password" [(ngModel)]="newPassword" placeholder="Nueva contraseña" class="input input-bordered w-full" />
    </div>

    <div class="form-control w-full">
      <label class="label"><span class="label-text font-semibold text-slate-600">Confirmar Nueva Contraseña</span></label>
      <input type="password" [(ngModel)]="confirmPassword" placeholder="Repite la contraseña" class="input input-bordered w-full" />
    </div>
  </div>

  <div class="mt-8 flex justify-end">
    <button class="btn btn-primary text-white px-8" (click)="cambiarContrasena()" [disabled]="!currentPassword || !newPassword || !confirmPassword">
      Actualizar Contraseña
    </button>
  </div>
</div>
