<div class="flex h-screen bg-slate-100 overflow-hidden text-slate-800 font-sans">
    
    <!-- BARRA LATERAL (SIDEBAR) -->
    <div id="menu" class="bg-gray-900 text-slate-300 w-64 fixed left-0 h-screen overflow-y-auto flex flex-col z-20 shadow-xl">
        
        <!-- Marca / Logo -->
        <div id="logo" class="my-6 px-6 flex items-center gap-3">
            <div class="bg-primary text-primary-content rounded-xl w-10 h-10 flex items-center justify-center shadow-lg">
                <span class="text-2xl">🛠️</span>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">Mesa<span class="text-primary">Ayuda</span></h1>
                <p class="text-slate-400 text-xs">Telemática Batallón</p>
            </div>
        </div>

        <!-- Perfil de Usuario -->
        <div id="profile" class="px-6 py-6 border-t border-slate-800 mt-2">
            <p class="text-slate-500 text-xs uppercase font-bold tracking-wider mb-3">Administrador</p>
            <a href="#" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                <div class="avatar placeholder">
                  <div class="bg-neutral text-neutral-content rounded-full w-10 h-10 flex items-center justify-center shadow-md">
                    <span class="text-sm font-semibold">{{ userInitials() }}</span>
                  </div>
                </div>
                <div class="flex flex-col">
                    <span class="text-sm font-bold text-white leading-tight">{{ user()?.fullname || 'Admin' }}</span>
                    <span class="text-xs text-slate-400">Ver perfil</span>
                </div>
            </a>
        </div>

        <!-- Navegación -->
        <div id="nav" class="w-full flex-1 px-4 mt-6 space-y-2">
            
            <!-- Panel Principal -->
            <a routerLink="./inicio" class="w-full px-4 py-3 rounded-xl flex items-center gap-3 bg-primary text-white shadow-md shadow-primary/30 hover:bg-primary/90 transition-all">
                <i class='bx bxs-dashboard text-xl'></i>
                <span class="text-sm font-bold">Panel Principal</span>
            </a>
            
            <!-- Incidencias -->
            <a routerLink="./tickets" class="w-full px-4 py-3 rounded-xl flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition-all">
                <i class='bx bx-receipt text-xl'></i>
                <span class="text-sm font-bold">Incidencias</span>
            </a>

            <!-- Usuarios -->
            <a routerLink="./usuarios" class="w-full px-4 py-3 rounded-xl flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition-all">
                <i class='bx bx-group text-xl'></i>
                <span class="text-sm font-bold">Usuarios</span>
            </a>

            <!-- Reportes -->
            <a routerLink="./reportes" class="w-full px-4 py-3 rounded-xl flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition-all">
                <i class='bx bx-bar-chart-alt-2 text-xl'></i>
                <span class="text-sm font-bold">Reportes</span>
            </a>

            <!-- Configuración -->
            <a routerLink="./configuracion" class="w-full px-4 py-3 rounded-xl flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition-all">
                <i class='bx bx-cog text-xl'></i>
                <span class="text-sm font-bold">Configuración</span>
            </a>
        </div>

        <!-- Botón de Salida -->
        <div class="px-4 py-6 border-t border-slate-800">
            <button (click)="onLogout()" class="w-full px-4 py-3 rounded-xl flex items-center gap-3 text-error hover:bg-error/10 transition-all font-semibold">
                <i class='bx bx-log-out text-xl'></i>
                <span class="text-sm">Cerrar Sesión</span>
            </button>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL (DERECHA) -->
    <div class="ml-64 flex-1 flex flex-col h-screen overflow-hidden bg-slate-50">
        
        <!-- Cabecera Top (Header) -->
        <header class="bg-white shadow-sm border-b border-slate-200 h-20 flex items-center justify-between px-10 z-10">
            <h2 class="text-2xl font-bold text-slate-800">Resumen General</h2>
            <div class="flex items-center gap-4">
                <div class="relative">
                    <i class='bx bx-bell text-2xl text-slate-400 hover:text-primary cursor-pointer transition-colors'></i>
                    <span class="absolute top-0 right-0 w-2.5 h-2.5 bg-error rounded-full border-2 border-white"></span>
                </div>
            </div>
        </header>

        <!-- Área Dinámica de Contenido -->
        <main class="flex-1 overflow-y-auto p-10">
            <div class="w-full max-w-7xl mx-auto">
                
                <!-- Cards de Resumen (Muestra temporal de cómo se verá el contenido) -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <!-- Card 1 -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-5 hover:shadow-md transition-shadow">
                        <div class="bg-blue-100 text-blue-600 p-4 rounded-xl text-3xl">
                            <i class='bx bx-receipt'></i>
                        </div>
                        <div>
                            <p class="text-slate-500 text-sm font-medium mb-1">Tickets Pendientes</p>
                            <p class="text-3xl font-bold text-slate-800">12</p>
                        </div>
                    </div>
                    <!-- Card 2 -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-5 hover:shadow-md transition-shadow">
                        <div class="bg-emerald-100 text-emerald-600 p-4 rounded-xl text-3xl">
                            <i class='bx bx-check-circle'></i>
                        </div>
                        <div>
                            <p class="text-slate-500 text-sm font-medium mb-1">Tickets Resueltos</p>
                            <p class="text-3xl font-bold text-slate-800">48</p>
                        </div>
                    </div>
                    <!-- Card 3 -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-5 hover:shadow-md transition-shadow">
                        <div class="bg-purple-100 text-purple-600 p-4 rounded-xl text-3xl">
                            <i class='bx bx-time'></i>
                        </div>
                        <div>
                            <p class="text-slate-500 text-sm font-medium mb-1">Tiempo Medio</p>
                            <p class="text-3xl font-bold text-slate-800">2.4 <span class="text-sm font-medium text-slate-500">hrs</span></p>
                        </div>
                    </div>
                </div>

                <!-- Aquí Angular inyectará los componentes hijos (tablas, detalles, etc) -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 min-h-[400px] flex items-center justify-center border-dashed">
                    <div class="text-center">
                        <p class="text-slate-400 text-lg mb-2">Área de Contenido (Router Outlet)</p>
                        <router-outlet></router-outlet>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>
