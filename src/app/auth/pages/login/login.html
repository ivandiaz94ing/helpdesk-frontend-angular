<div class="min-h-screen bg-gradient-to-br from-base-200 to-base-300 flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-2xl">
    <div class="card-body">
      <!-- Logo and Title -->
      <div class="flex flex-col items-center mb-6">
        <div class="avatar placeholder mb-4">
          <div class="bg-primary text-primary-content rounded-full w-20 shadow-lg">
            <span class="text-3xl">🛠️</span>
          </div>
        </div>
        <h2 class="card-title text-2xl font-bold">Mesa de Ayudas</h2>
        <p class="text-base-content/70 text-sm text-center mt-1">
          Inicia sesión para gestionar los requerimientos del Batallón
        </p>
      </div>

      <form>
        <!-- Email Input -->
        <div class="form-control w-full mb-4">
          <label class="label">
            <span class="label-text font-semibold">Correo Electrónico</span>
          </label>
          <label class="input input-bordered flex items-center gap-2 focus-within:outline-primary">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4 opacity-70"><path d="M2.5 3A1.5 1.5 0 0 0 1 4.5v.793c.026.009.051.02.076.032L7.674 8.51c.206.1.446.1.652 0l6.598-3.185A.755.755 0 0 1 15 5.293V4.5A1.5 1.5 0 0 0 13.5 3h-11Z" /><path d="M15 6.954 8.978 9.86a2.25 2.25 0 0 1-1.956 0L1 6.954V11.5A1.5 1.5 0 0 0 2.5 13h11a1.5 1.5 0 0 0 1.5-1.5V6.954Z" /></svg>
            <input type="email" class="grow" placeholder="usuario@ejercito.mil.co" required />
          </label>
        </div>

        <!-- Password Input -->
        <div class="form-control w-full mb-2">
          <label class="label">
            <span class="label-text font-semibold">Contraseña</span>
          </label>
          <label class="input input-bordered flex items-center gap-2 focus-within:outline-primary">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4 opacity-70"><path fill-rule="evenodd" d="M14 6a4 4 0 0 1-4.899 3.899l-1.955 1.955a.5.5 0 0 1-.353.146H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2.293a.5.5 0 0 1 .146-.353l3.955-3.955A4 4 0 1 1 14 6Zm-4-2a.75.75 0 0 0 0 1.5.5.5 0 0 1 .5.5.75.75 0 0 0 1.5 0 2 2 0 0 0-2-2Z" clip-rule="evenodd" /></svg>
            <input type="password" class="grow" placeholder="••••••••" required />
          </label>
          <label class="label justify-end">
            <a href="#" class="label-text-alt link link-hover text-primary">¿Olvidaste tu contraseña?</a>
          </label>
        </div>

        <!-- Submit Button -->
        <div class="form-control mt-6">
          <button class="btn btn-primary shadow-lg hover:shadow-xl transition-all w-full text-lg">
            Ingresar
          </button>
        </div>
      </form>
      
      <div class="divider text-xs text-base-content/40 mt-8 mb-4">Soporte Técnico</div>
      <div class="text-center text-sm text-base-content/70">
        Si tienes problemas, contacta a la sección de Telemática del Batallón.
      </div>
    </div>
  </div>
</div>
