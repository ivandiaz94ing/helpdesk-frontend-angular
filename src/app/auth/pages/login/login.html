<div class="flex min-h-screen">
  <!-- Mitad Izquierda: Imagen y Marca (Se oculta en celulares para no estorbar) -->
  <div class="hidden lg:flex lg:w-3/5 relative bg-neutral text-neutral-content items-center
  justify-center overflow-hidden">
    <!-- Imagen de fondo -->
    <div class="absolute inset-0 z-0">
      <!-- Apuntamos a la imagen que guardaste en tu carpeta public -->
      <img src="/login-bg.jpg" alt="Background Telemática" class="w-full h-full object-cover
  opacity-50" />
      <!-- Un degradado encima de la imagen para oscurecerla un poco y que se lea mejor el
  texto -->
      <div class="absolute inset-0 bg-gradient-to-r from-base-300/90 to-transparent"></div>
    </div>

    <!-- Texto sobre la imagen -->
    <div class="relative z-10 w-full max-w-2xl p-12">
      <div class="avatar placeholder mb-6">
        <div class="bg-primary text-primary-content rounded-2xl w-24 shadow-2xl">
          <span class="text-4xl">🛠️</span>
        </div>
      </div>
      <h1 class="text-5xl font-extrabold mb-4 tracking-tight text-white drop-shadow-lg">
        Mesa de Ayudas <span class="text-primary">Telemática</span>
      </h1>
      <p class="text-xl text-gray-300 font-light max-w-lg drop-shadow-md">
        Sistema centralizado para el reporte y gestión de incidencias tecnológicas del Batallón.
        Rápido, seguro y eficiente.
      </p>
    </div>
  </div>

  <!-- Mitad Derecha: Formulario de Login -->
  <div class="w-full lg:w-2/5 flex items-center justify-center bg-base-100 p-8 sm:p-12 shadow-
  [-20px_0_30px_-15px_rgba(0,0,0,0.1)] z-20">
    <div class="w-full max-w-md">

      <!-- Título para versión móvil (solo se ve en pantallas pequeñas) -->
      <div class="flex lg:hidden flex-col items-center mb-8">
        <div class="avatar placeholder mb-4">
          <div class="bg-primary text-primary-content rounded-xl w-16 shadow-lg">
            <span class="text-2xl">🛠️</span>
          </div>
        </div>
        <h2 class="text-3xl font-bold">Mesa de Ayudas</h2>
      </div>

      <!-- Texto de Bienvenida -->
      <div class="mb-10">
        <h2 class="text-3xl font-bold text-base-content mb-2">Bienvenido de nuevo</h2>
        <p class="text-base-content/60">Ingresa tus credenciales para acceder al panel.</p>
      </div>

      <!-- FORMULARIO (Mantuve tu ngSubmit para que valide bien) -->
      <form (ngSubmit)="onLogin()">

        <div class="form-control w-full mb-5">
          <label class="label">
            <span class="label-text font-medium text-base-content/80">Correo Electrónico</span>
          </label>
          <label class="input input-bordered flex items-center gap-3 focus-within:outline-
  primary bg-base-200/50 transition-all">
            <i class='bx bx-envelope text-xl opacity-50'></i>
            <input type="email" class="grow" placeholder="usuario@ejercito.mil.co" required />
          </label>
        </div>

        <div class="form-control w-full mb-6">
          <label class="label">
            <span class="label-text font-medium text-base-content/80">Contraseña</span>
          </label>
          <label class="input input-bordered flex items-center gap-3 focus-within:outline-
  primary bg-base-200/50 transition-all">
            <i class='bx bx-key text-xl opacity-50'></i>
            <input type="password" class="grow" placeholder="••••••••" required />
          </label>
          <label class="label justify-end mt-1">
            <a href="#" class="label-text-alt link link-hover text-primary font-
  medium">¿Olvidaste tu contraseña?</a>
          </label>
        </div>

        <div class="form-control mt-8">
          <!-- Botón tipo submit para las validaciones -->
          <button (click)="onLogin()" type="submit" class="btn btn-primary shadow-lg shadow-primary/30
  hover:shadow-xl hover:-translate-y-0.5 transition-all w-full text-lg">
            Ingresar a la plataforma
          </button>
        </div>
      </form>

      <!-- Footer Info -->
      <div class="mt-16 text-center text-sm text-base-content/40">
        <p>&copy; 2026 Batallón. Todos los derechos reservados.</p>
      </div>
    </div>
  </div>
</div>
